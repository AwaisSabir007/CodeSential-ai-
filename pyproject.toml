[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codesentinel-backend"
version = "0.1.0"
description = "CodeSentinel AI - Agentic Code Security Platform Backend"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CodeSentinel AI Team" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "watchdog>=6.0.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "psutil>=6.1.0",
    "platformdirs>=4.3.0",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "structlog>=24.4.0",
    "rich>=13.9.0",
    "anyio>=4.7.0",
    "click>=8.1.8",
    "gitpython>=3.1.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-passlib",
    "types-python-jose",
]
ml = [
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "datasets>=3.1.0",
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "sentence-transformers>=3.3.0",
    "faiss-cpu>=1.9.0",
]
agents = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-community>=0.3.0",
    "openai>=1.55.0",
    "google-generativeai>=0.8.0",
]

[project.scripts]
codesentinel = "backend.main:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "ml*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pragmatic production set: correctness + imports + bugbears + security.
# Style-only/modernization families (N, UP, A, T20, E501) are intentionally
# excluded to avoid churn; they can be reintroduced incrementally.
select = ["E", "W", "F", "I", "B", "C4"]
ignore = [
    "E501",   # line length — not enforced
    "E402",   # module import position (CLI/scripts set env before imports)
    "B008",   # function call in argument defaults (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
# This is a security tool: ML scaffolding and scanner/sample code legitimately
# contain example-insecure patterns and research scripts.
"tests/**" = ["B", "F811"]
"ml/**" = ["B", "F841"]

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true
exclude = ["ml/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --cov=backend --cov-report=term-missing"

[tool.coverage.run]
source = ["backend"]
omit = ["*/migrations/*", "*/tests/*"]
