[package]
name = "codesentinel-ai"
version = "1.0.0"
description = "CodeSentinel AI - Cross-Platform Agentic AI Code Security Platform"
authors = ["CodeSentinel AI Team"]
edition = "2021"

[lib]
name = "codesentinel_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
